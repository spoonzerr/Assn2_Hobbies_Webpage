<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Form - Hobbyssey</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/Components/navbar/navbar.css">
    <link rel="stylesheet" href="/Pages/Forms/GamingForm/GameForm.css">

    <script src="/Components/navbar/navbar.js" defer></script>
    <script src="/Pages/Forms/GamingForm/GameForm.js" defer></script>
</head>

<body>
    <div id="navbar"></div>

    <div class="crumbs" aria-label="Breadcrumb">
        <ol>
            <li><a href="/Pages/homePage/home.html">Home</a></li>
            <li><a href="/Pages/Hobbies/Gaming/hobbyGaming.html">Gaming</a></li>
            <li aria-current="page">Gaming - Sign Up</li>
        </ol>
    </div>

    <form action="/action_page.php">


        <!-- Get user first & last name -->
        <section class="form-section">
            <!-- name -->
            <div class="field">
                <label for="fname">First name <span class="required">*</span></label>
                <input type="text" id="fname" name="fname" required>
            </div>
            <div class="field">
                <label for="lname">Last name <span class="required">*</span></label>
                <input type="text" id="lname" name="lname" required>
            </div>

            <div class="field-row">
                <div class="field">
                    <label for="phone">Phone number</label>
                    <div class="phone-group">
                        <input type="text" id="countryCode" name="countryCode" class="country-code" placeholder="+65"
                            pattern="\+?[0-9]{" 1,4} required>
                        <input type="tel" id="phone" name="phone" pattern="[0-9\s\-]{6,12}" required>
                    </div>
                    <span class="error">Enter a valid country code and phone number.</span>
                </div>
                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error">Enter a valid email address.</span>
                </div>
            </div>

            <!-- Get user gender -->
            <p>Gender:</p>

            <div class="field">
                <p class="field-label">Gender <span class="required">*</span></p>
                <div class="radio-row">
                    <label class="radio"><input type="radio" name="gender" value="Male" required> Male</label>
                    <label class="radio"><input type="radio" name="gender" value="Female"> Female</label>
                    <label class="radio"><input type="radio" name="gender" value="Prefer not to say"> Prefer not to
                        say</label>
                </div>
            </div>

            <!-- Get user age -->
            <div class="field">
                <fieldset class="field">
                    <legend>Age group</legend>
                    <div class="radio-row">
                        <label class="radio"><input type="radio" name="ageGroup" value="Under 13" required> Under
                            13</label>
                        <label class="radio"><input type="radio" name="ageGroup" value="13-17"> 13-17</label>
                        <label class="radio"><input type="radio" name="ageGroup" value="18-24"> 18-24</label>
                        <label class="radio"><input type="radio" name="ageGroup" value="25-34"> 25-34</label>
                        <label class="radio"><input type="radio" name="ageGroup" value="35 and above"> 35 and
                            above</label>
                    </div>
                    <span class="error">Please choose an age group.</span>
                </fieldset>
            </div>
        </section>


        <input type="submit" value="Submit">
    </form>
</body>

</html>
