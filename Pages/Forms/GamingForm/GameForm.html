<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Form - Hobbyssey</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/Components/navbar/navbar.css">
    <link rel="stylesheet" href="/Pages/Forms/GamingForm/GameForm.css">

    <script src="/Components/navbar/navbar.js" defer></script>
    <script src="/Pages/Forms/GamingForm/GameForm.js" defer></script>
</head>

<body>
    <div id="navbar"></div>

    <div class="crumbs" aria-label="Breadcrumb">
        <ol>
            <li><a href="/Pages/homePage/home.html">Home</a></li>
            <li><a href="/Pages/Hobbies/Gaming/hobbyGaming.html">Gaming</a></li>
            <li aria-current="page">Gaming - Sign Up</li>
        </ol>
    </div>

    <form action="/action_page.php">


        <!-- Get user first & last name -->
        <section class="form-section">
            <div class="form-div">
            <label for="fname">First name:</label><br>
            <input type="text" id="fname" name="fname" value="John" required /><br>
            <label for="lname">Last name:</label><br>
            <input type="text" id="lname" name="lname" value="Doe" required /><br><br>

            <div class="field-row">
                <div class="field">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" pattern="[0-9+\s\-]{8,15}" required>
                    <span class="error">Enter a valid phone number (8–15 digits).</span>
                </div>
                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error">Enter a valid email address.</span>
                </div>
            </div>

            <!-- Get user gender -->
            <p>Gender:</p>

            <input type="radio" id="Male" name="Gender" value="Male">
            <label for="Male">Male</label><br>
            <input type="radio" id="Female" name="Gender" value="Female">
            <label for="Female">Female</label><br>
            <input type="radio" id="Unknown" name="Gender" value="Unknown">
            <label for="Unknown">Prefer not to say</label>

            <!-- Get user age -->
            <div class="field">
                <label for="ageGroup">Age group</label>
                <select id="ageGroup" name="ageGroup" required>
                    <option value="" selected disabled>Choose one…</option>
                    <option value="Under 13">Under 13</option>
                    <option value="13-17">13-17</option>
                    <option value="18-24">18-24</option>
                    <option value="25-34">25-34</option>
                    <option value="35 and above">35 and above</option>
                </select>
                <span class="error">Please select your age group.</span>
            </div>
        </section>


        <input type="submit" value="Submit">
    </form>





    <p>If you click the "Submit" button, the form-data will be sent to a page called "/action_page.php".</p>
</body>

</html>
